name: Test docker

on:
  push:
    branches:
      - master
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - uses: ./.github/actions/setup-docker-classic
      - name: Check 1
        run: |
          ls  /opt/hostedtoolcache/docker-archive-stable/29.3.1/x64/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Check 2
        run: |
          ls  /opt/hostedtoolcache/docker-archive-stable/29.3.1/x64/
